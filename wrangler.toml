name = "zibuke-community"
main = ".open-next/worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production database.

[[d1_databases]]
binding = "DB"
database_name = "zibuke-db"
database_id = "235027b8-9218-4cec-85c2-3a9424234e66"
migrations_dir = "drizzle"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "zibuke-community"

# Run `wrangler r2 bucket create zibuke-community-opennext-cache` before deploying.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "zibuke-community-opennext-cache"

# Run `wrangler r2 bucket create zibuke-media` before deploying.
[[r2_buckets]]
binding = "ZIBUKE_BUCKET"
bucket_name = "zibuke-media"

[images]
binding = "IMAGES"

[ai]
binding = "AI"

# Set CRON_SECRET using `wrangler secret put CRON_SECRET` (never commit its value).
